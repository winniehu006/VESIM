name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build, e.g. v2.1.36'
        required: true

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare frontend
        shell: pwsh
        run: |
          npm ci --prefix web
          npm run build --prefix web
          if (Test-Path internal/web/dist) { Remove-Item -Recurse -Force internal/web/dist }
          Copy-Item -Recurse web/dist internal/web/dist

      - name: Vet and compile tests
        shell: pwsh
        run: |
          go vet ./cmd/... ./internal/... ./pkg/...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          go test -run ZZZNoSuchTest -count=1 ./cmd/... ./internal/... ./pkg/...
          if ($LASTEXITCODE -ne 0) { throw "test compilation failed" }

      - name: Build portable package
        shell: pwsh
        run: |
          .\build-windows.ps1 -Version "${{ steps.vars.outputs.version }}" -SkipFrontend

      - name: Write checksum
        shell: pwsh
        run: |
          $version = "${{ steps.vars.outputs.version }}"
          $zip = "dist\vesim_${version}_windows_amd64.zip"
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sum  vesim_${version}_windows_amd64.zip" |
            Out-File -NoNewline "dist\vesim_${version}_windows_amd64.zip.sha256"

      - name: Compose release notes
        shell: bash
        run: |
          version="${{ steps.vars.outputs.version }}"
          sum="$(cut -d' ' -f1 "dist/vesim_${version}_windows_amd64.zip.sha256")"
          cat > notes.md <<EOF
          Windows portable build of VESIM.

          - \`vesim_${version}_windows_amd64.zip\` — unzip it anywhere, run \`start-vesim.bat\`, then open <http://localhost:7575> (default \`admin\` / \`admin\`, change on first sign-in).
          - SHA256: \`${sum}\`

          This fork publishes Windows builds only. Linux / Docker / OpenWrt deployment is not built here; use [upstream HiDeck](https://github.com/yibaiba/hideck) for modem deployments.
          EOF

      - name: Create the release when missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.vars.outputs.version }}"
          gh release view "$version" >/dev/null 2>&1 || gh release create "$version" \
            --title "VESIM $version (Windows)" \
            --notes-file notes.md

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.vars.outputs.version }}"
          gh release upload "$version" \
            "dist/vesim_${version}_windows_amd64.zip" \
            "dist/vesim_${version}_windows_amd64.zip.sha256" \
            --clobber

      - name: Publish release notes with the checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.vars.outputs.version }}"
          gh release edit "$version" --title "VESIM $version (Windows)" --notes-file notes.md